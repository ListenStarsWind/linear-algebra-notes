标题: 三维向量线性组合交互实验

向量:
  u: [2, 0, 1]
  v: [0, 2, 1]
  w: [1, 1, 3]

初始系数:
  c: 0.3333333333
  d: 0.3333333333
  e: 0.3333333333

滑块:
  最小值: -1.5
  最大值: 1.5
  步长: 0.05

