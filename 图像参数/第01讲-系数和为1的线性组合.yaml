标题: 系数和为1的线性组合

向量:
  v: [4, 1]
  w: [1, 4]

线性组合:
  - 名称: 四分之一
    c: 0.25
    d: 0.75

  - 名称: 中点
    c: 0.5
    d: 0.5

  - 名称: 四分之三
    c: 0.75
    d: 0.25

  - 名称: 越过v
    c: 1.5
    d: -0.5

  - 名称: 越过w
    c: -0.5
    d: 1.5

坐标范围:
  x: [-2, 7]
  y: [-2, 7]

输出:
  svg: 静态图像/第01讲-系数和为1的线性组合.svg
